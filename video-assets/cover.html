<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@500;700&family=JetBrains+Mono:wght@500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root { --paper:#EEF2E4; --ink:#111; --g:#12B886; --r:#FF4A3D; --y:#FFE14A; --p:#7B61FF; --o:#E5602A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); font-family:Onest, sans-serif; color:var(--ink); overflow:hidden; position:relative; }
  .t { font:800 92px/.98 Unbounded; letter-spacing:-.035em; text-transform:uppercase; }
  .st { position:absolute; font:800 34px/1 Unbounded; text-transform:uppercase; border:5px solid var(--ink); box-shadow:10px 10px 0 var(--ink);
    padding:16px 24px; border-radius:16px; white-space:nowrap; }
  .ph { position:absolute; border:6px solid var(--ink); border-radius:30px; box-shadow:14px 14px 0 var(--ink); overflow:hidden; background:#fff; }
  .ph img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .cur { position:absolute; font:500 26px JetBrains Mono; background:var(--g); color:#fff; padding:9px 18px; border-radius:12px; border:4px solid var(--ink); white-space:nowrap; }
  .chip { display:inline-block; font:700 28px Onest; border:4px solid var(--ink); border-radius:99px; padding:10px 22px; background:#fff; margin:0 10px 12px 0; }
  /* 16:9 */
  body.wide { width:1280px; height:720px; }
  .wide .t { position:absolute; left:64px; top:64px; width:680px; font-size:80px; }
  .wide .chips { position:absolute; left:64px; top:430px; width:660px; }
  /* квадрат */
  body.sq { width:1080px; height:1080px; }
  .sq .t { position:absolute; left:60px; top:64px; width:960px; font-size:84px; }
</style></head>
<body>
<script>
const wide = location.hash !== "#sq";
document.body.className = wide ? "wide" : "sq";
const P = (l, t, w, src, r) => `<div class="ph" style="left:${l}px;top:${t}px;width:${w}px;height:${w * 1.3}px;transform:rotate(${r}deg)"><img src="${src}"></div>`;
document.body.innerHTML = wide ? `
  <div class="t">Монтаж видео нейро&shy;сетями</div>
  <div class="chips"><span class="chip">3 курса</span><span class="chip">18 уроков</span><span class="chip">с нуля</span></div>
  ${P(770, 90, 230, "hook_2_schetchik.jpg", -5)}${P(1000, 150, 230, "r_score.jpg", 4)}
  <div class="st" style="left:930px;top:110px;background:var(--r);color:#fff;font-size:30px;transform:rotate(4deg)">46 → 81</div>
  <div class="st" style="left:740px;top:520px;background:var(--y);transform:rotate(-3deg)">без монтажёра</div>
  <div class="cur" style="left:900px;top:620px">✳ Claude монтирует</div>
  <div class="st" style="left:64px;top:600px;background:var(--o);color:#fff;font-size:28px;padding:12px 20px">Reels · TikTok · Shorts</div>`
: `
  <div class="t">Монтаж видео<br>нейросетями</div>
  <div class="st" style="left:60px;top:300px;background:var(--y);transform:rotate(-3deg)">без монтажёра</div>
  <div class="st" style="left:540px;top:300px;background:var(--o);color:#fff;transform:rotate(2deg)">3 курса · 18 уроков</div>
  ${P(150, 470, 340, "hook_2_schetchik.jpg", -4)}${P(580, 500, 340, "r_score.jpg", 4)}
  <div class="st" style="left:430px;top:450px;background:var(--r);color:#fff;transform:rotate(3deg)">46 → 81</div>
  <div class="cur" style="left:600px;top:980px">✳ Claude монтирует</div>`;
</script></body></html>
